[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complexity"
version = "0.1.0"
description = "Compact standalone repo for theory and DNN complexity pipelines"
requires-python = ">=3.10"

[tool.complexity.cleanup]
ignored_path_delete_policy = "trash-cli"
windows_trash_equivalent = "send2trash"
label_ignored_payloads_before_trash = true

[tool.complexity.execution]
smoke_before_expensive_run = true
avoid_timeout_unless_day_scale = true
record_smoke_estimate_and_elapsed = true

[tool.pytest.ini_options]
norecursedirs = [
  "deprecated",
  "payloads",
  ".git",
  ".venv",
  ".pytest_cache",
  "__pycache__",
]
