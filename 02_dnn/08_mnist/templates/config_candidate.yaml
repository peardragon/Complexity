experiment_id: mnist14_3rule_1024
mode: candidate
root: 02_dnn/08_mnist
dataset:
  n_splits: 5
  n_train: 1024
  n_test: 2048
  downsample: avgpool_2x2_to_14x14
  input_dim: 196
  label_rules:
    - real_even_odd
    - teacher_nn
    - random_label
model:
  architecture: 196-16-16-1-tanh
  input_dim: 196
  hidden_width: 16
  hidden_layers: 2
  activation: tanh
  P: 3441
loss:
  beta: 1.0
  ce_convention: mean_in_code_sum_in_target
  gamma_ce: beta_times_n_train
  lambda_reg_candidates: [1.0, 10.0, 50.0, 100.0]
reference_search:
  selected_refs_per_dataset: 10
  max_attempts_per_dataset: 60
  optimizer: adam_then_lbfgs
sampling:
  main: pm_sais_H_infinity
  optional_H_ladder: [8, 4, 2]
  r0: 0.05
  radii: [0.05, 0.10, 0.20, 0.45, 0.80, 1.20, 1.60, 2.00]
  samples_per_ref_radius:
    "0.05": 256
    "0.10": 256
    "0.20": 512
    "0.45": 512
    "0.80": 1024
    "1.20": 2048
    "1.60": 2048
    "2.00": 4096
qc:
  failed_radius_policy: no_claim
  q05_ess_fraction_min: 0.04
  max_split_logZ_per_P_diff: 0.004
  bootstrap_sd_phi_max: 0.012
